syntax = "proto3";

option csharp_namespace = "AP.Contracts.Communication.Grpc.Common";

package ap.common;

// 通用操作结果
message OperationResult {
	bool success = 1;
	string message = 2;
	string error_code = 3;
}

// 高精度时间戳
message Timestamp {
	int64 ticks = 1; // C# Ticks
}